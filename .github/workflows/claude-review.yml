name: Claude code review

# AI code review on every pull request. Claude reviews against CLAUDE.md,
# comments inline, and writes its findings to a file; an open "high" finding
# fails this check, which blocks the merge (branch protection).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # one of the two secrets is enough: API key (Console) or Claude subscription token
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # use the workflow's own token, so no GitHub App installation is needed
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read CLAUDE.md first; its rules are binding. Use the rls-reviewer agent for every
            change under supabase/migrations.
            Check in particular:
            - every new table has RLS enabled, policies, and a pgTAP test tagged "-- covers: <policy>";
            - no applied migration is edited; no DELETE grants; SECURITY DEFINER pins search_path;
            - the PR description names the briefing IDs, the modules and the flows/events (F…/E…);
            - Edge Functions validate input, never log secrets or personal data, and are tested;
            - visible program texts are German.
            Post each finding as an inline comment with a severity: high, medium or low.
            If the PR is clean, post one short PR comment saying what you checked.
            Return every finding in the structured output (an empty list when the PR is clean).
          claude_args: >-
            --json-schema '{"type":"object","required":["findings"],"properties":{"findings":{"type":"array","items":{"type":"object","required":["severity","file","summary"],"properties":{"severity":{"type":"string","enum":["high","medium","low"]},"file":{"type":"string"},"line":{"type":"integer"},"summary":{"type":"string"}}}}}}'
            --allowedTools "Read,Glob,Grep,Task,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      - name: Block on open high findings
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$STRUCTURED" ] || ! jq -e '.findings' <<<"$STRUCTURED" >/dev/null 2>&1; then
            echo "No structured review output. Last message from Claude:"
            jq -r '[.[] | select(.type == "result")] | last | .result // empty' "$EXECUTION_FILE" 2>/dev/null | head -40
            exit 1
          fi
          high=$(jq '[.findings[] | select(.severity == "high")] | length' <<<"$STRUCTURED")
          echo "High findings: $high"
          jq -r '.findings[] | "\(.severity)\t\(.file):\(.line // 0)\t\(.summary)"' <<<"$STRUCTURED"
          test "$high" -eq 0
